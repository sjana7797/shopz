services:
  shopz:
    image: postgres:17-alpine
    container_name: shopz
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopz
    volumes:
      - shopz:/var/lib/postgresql/data

  merch-manage:
    image: postgres:17-alpine
    container_name: merch-manage
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: merch_manage
    volumes:
      - merch-manage:/var/lib/postgresql/data

  cms_db:
    image: postgres:17-alpine
    container_name: shopz-cms
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopz_cms
    volumes:
      - shopz-cms:/var/lib/postgresql/data

volumes:
  shopz:
  shopz-cms:
  merch-manage:
